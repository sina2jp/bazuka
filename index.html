<body>
<canvas id="cv" aria-label="Game"></canvas>
<div id="app">
<section id="home" class="screen on">
  <div class="home-wrap">
    <header class="brand">
      <h1 class="logo"><span class="lat">BAZUKA</span><span class="fa">بازوکا</span></h1>
      <p class="tag" data-i18n="subtitle"></p>
    </header>
    <div class="col">
      <div class="card profile">
        <canvas class="ava big" id="meAva" width="64" height="64"></canvas>
        <div class="pf"><div class="pname" id="meName"></div><button class="link" id="bEdit" data-i18n="editChar"></button></div>
        <div class="langsw" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="fa">فا</button></div>
      </div>
      <div class="card menu">
        <button class="btn tq xl" id="bCreate"><i class="ic" data-ic="globe"></i><span data-i18n="createGame"></span></button>
        <form class="joinrow" id="joinForm"><input id="codeIn" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" data-i18n-ph="codePh" aria-label="Game code"><button class="btn" id="bJoinCode" data-i18n="join"></button></form>
        <div class="row2">
          <button class="btn sun" id="bAI"><i class="ic" data-ic="robot"></i><span data-i18n="vsComputer"></span></button>
          <button class="btn" id="bPass"><i class="ic" data-ic="two"></i><span data-i18n="oneDevice"></span></button>
        </div>
      </div>
      <div class="card board" id="boardCard" hidden><h3 data-i18n="scoreboard"></h3><div id="boardList"></div></div>
      <div class="home-foot">
        <button class="iconbtn" id="bHelp" aria-label="Help"><i class="ic" data-ic="help"></i></button>
        <button class="iconbtn" id="bSettings" aria-label="Settings"><i class="ic" data-ic="gear"></i></button>
      </div>
    </div>
  </div>
</section>
<section id="joinScr" class="screen">
  <div class="card narrow joincard">
    <div class="langsw center" role="group" aria-label="Language"><button data-lang="en">English</button><button data-lang="fa">فارسی</button></div>
    <h2 data-i18n="invited"></h2>
    <p class="sub" data-i18n="invitedSub"></p>
    <canvas class="ava huge" id="joinAva" width="96" height="96"></canvas>
    <label class="fld"><span data-i18n="yourName"></span><input id="joinName" maxlength="16" autocomplete="off"></label>
    <div class="swatches" id="joinColors"></div>
    <button class="btn tq xl" id="bJoinGo"><span data-i18n="join"></span></button>
    <button class="link" id="bJoinEdit" data-i18n="editChar"></button>
  </div>
</section>
<section id="lobby" class="screen">
  <div class="lobby-wrap">
    <div class="lob-head">
      <button class="iconbtn" id="bLobbyBack" aria-label="Back"><i class="ic" data-ic="back"></i></button>
      <h2 data-i18n="lobby"></h2>
      <div class="netpill" id="netPill"><i></i><span></span></div>
    </div>
    <div class="slots">
      <div class="slot" id="slot0"><canvas class="ava big" width="64" height="64"></canvas><b class="sname"></b><span class="stag"></span></div>
      <div class="vs">VS</div>
      <div class="slot" id="slot1"><canvas class="ava big" width="64" height="64"></canvas><b class="sname"></b><span class="stag"></span></div>
    </div>
    <div class="card invite" id="invitePanel">
      <h3 data-i18n="inviteTitle"></h3>
      <p data-i18n="inviteText"></p>
      <div class="linkbox"><input id="linkOut" readonly aria-label="Invite link"><button class="btn sm" id="bCopy"><i class="ic" data-ic="copy"></i><span data-i18n="copyLink"></span></button></div>
      <div class="sharerow">
        <button class="btn tq sm" id="bShare"><i class="ic" data-ic="share"></i><span data-i18n="share"></span></button>
        <a class="btn sm wa" id="aWa" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn sm tg" id="aTg" target="_blank" rel="noopener">Telegram</a>
      </div>
      <p class="hint"><span data-i18n="gameCode"></span>: <b id="codeOut" dir="ltr"></b> · <span data-i18n="sameLink"></span></p>
    </div>
    <div class="card" id="matchCard"><h3 data-i18n="matchSettings"></h3><div id="matchSet"></div></div>
    <p class="hint warn" id="netHint"></p>
    <div class="lob-foot">
      <button class="round big" id="bLobChat" aria-label="Chat"><i class="ic" data-ic="chat"></i><b class="badge"></b></button>
      <button class="btn pom xl" id="bStart"><span data-i18n="start"></span></button>
      <div class="waitmsg" id="waitMsg"></div>
    </div>
  </div>
</section>
<section id="game" class="screen">
  <div class="hud-top">
    <div class="pcard" id="pc0"><canvas class="ava sm" width="40" height="40"></canvas><div class="pinfo"><b class="pn"></b><div class="hp"><i></i></div></div><div class="wins"></div></div>
    <div class="hud-mid">
      <div class="timer" id="timer"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="tr" cx="20" cy="20" r="17"/><circle class="tf" cx="20" cy="20" r="17"/></svg><span></span></div>
      <div class="wind" id="windBox"><small data-i18n="wind"></small><div class="wa"></div></div>
    </div>
    <div class="pcard r" id="pc1"><canvas class="ava sm" width="40" height="40"></canvas><div class="pinfo"><b class="pn"></b><div class="hp"><i></i></div></div><div class="wins"></div></div>
  </div>
  <div class="banner" id="banner"></div>
  <div class="tgthint" id="tgtHint" data-i18n="tapTarget"></div>
  <div class="hud-bot" id="hudBot">
    <div class="cl">
      <button class="mv" id="bL" aria-label="Walk left"><i class="ic" data-ic="left"></i></button>
      <button class="mv" id="bR" aria-label="Walk right"><i class="ic" data-ic="right"></i></button>
      <div class="fuel" id="fuelBar" title="Fuel"><i></i></div>
    </div>
    <div class="cm">
      <button class="round" id="bEmo" aria-label="Reactions"><i class="ic" data-ic="smile"></i></button>
      <button class="round" id="bChat" aria-label="Chat"><i class="ic" data-ic="chat"></i><b class="badge"></b></button>
      <button class="round" id="bMenu" aria-label="Menu"><i class="ic" data-ic="menu"></i></button>
    </div>
    <div class="cr">
      <div class="aimpad" id="aimPad">
        <div class="ap"><button data-ad="a-" aria-label="Lower">−</button><span id="angOut"></span><button data-ad="a+" aria-label="Raise">+</button></div>
        <div class="ap"><button data-ad="p-" aria-label="Less power">−</button><span id="powOut"></span><button data-ad="p+" aria-label="More power">+</button></div>
      </div>
      <button class="weap" id="bWeap" aria-label="Weapons"><span class="wi" id="wIcon"></span><b id="wAmmo"></b></button>
      <button class="fire" id="bFire"><span data-i18n="fire"></span><svg class="cdring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/></svg></button>
    </div>
  </div>
  <div class="tray" id="tray" hidden></div>
  <div class="reacts" id="reacts" hidden></div>
  <div class="waitover" id="waitOver" hidden><div class="card"><div class="spin"></div><p id="waitText"></p><p class="hint" id="waitTip"></p><button class="btn sm" id="bWaitLeave" data-i18n="leave"></button></div></div>
</section>
<aside id="chat" class="drawer" hidden>
  <div class="ch-head"><b data-i18n="chat"></b><span class="sp"></span><button class="btn sm tq" id="bVoice"><i class="ic" data-ic="mic"></i><span data-i18n="voice"></span></button><button class="iconbtn" id="bChatClose" aria-label="Close"><i class="ic" data-ic="close"></i></button></div>
  <div class="ch-log" id="chatLog"></div>
  <div class="ch-typing" id="chatTyping"></div>
  <div class="ch-phr" id="chatPhr"></div>
  <div class="ch-emo" id="chatEmo" hidden></div>
  <form class="ch-in" id="chatForm"><button type="button" class="iconbtn" id="bEmoPick" aria-label="Emoji"><i class="ic" data-ic="smile"></i></button><input id="chatIn" maxlength="200" autocomplete="off" data-i18n-ph="typeMsg" aria-label="Message"><button class="btn sm tq" id="bSend"><span data-i18n="send"></span></button></form>
</aside>
<div class="modal" id="mChar" hidden><div class="card">
  <div class="mhead"><h3 data-i18n="editChar"></h3><button class="iconbtn" data-close aria-label="Close"><i class="ic" data-ic="close"></i></button></div>
  <div class="charwrap"><canvas class="ava huge" id="charAva" width="110" height="110"></canvas>
    <label class="fld"><span data-i18n="yourName"></span><input id="charName" maxlength="16" autocomplete="off"></label></div>
  <h4 data-i18n="color"></h4><div class="swatches" id="charColors"></div>
  <h4 data-i18n="hat"></h4><div class="picks" id="charHats"></div>
  <h4 data-i18n="face"></h4><div class="picks" id="charFaces"></div>
  <button class="btn tq xl" data-close><span data-i18n="done"></span></button>
</div></div>

  <div class="setrow"><label data-i18n="language"></label><div class="langsw"><button data-lang="en">English</button><button data-lang="fa">فارسی</button></div></div>
  <div class="setrow"><label for="volM" data-i18n="music"></label><input type="range" id="volM" min="0" max="1" step="0.05"></div>
  <div class="setrow"><label for="volS" data-i18n="sounds"></label><input type="range" id="volS" min="0" max="1" step="0.05"></div>
  <div class="setrow"><label data-i18n="track"></label><div class="seg" id="trackSeg"></div></div>
  <div class="setrow"><label data-i18n="vibrate"></label><div class="seg" id="vibSeg"></div></div>
  <div class="mfoot"><button class="btn sm" id="bHelp2"><i class="ic" data-ic="help"></i><span data-i18n="help"></span></button><button class="btn sm pom" id="bLeave" data-i18n="leave"></button></div>
</div></div>
<div class="modal" id="mHelp" hidden><div class="card">
  <div class="mhead"><h3 data-i18n="help"></h3><button class="iconbtn" data-close aria-label="Close"><i class="ic" data-ic="close"></i></button></div>
  <ol class="steps"><li data-i18n="help1"></li><li data-i18n="help2"></li><li data-i18n="help3"></li><li data-i18n="help4"></li></ol>
  <p class="hint keys" data-i18n="keys"></p>
  <button class="btn tq xl" data-close><span data-i18n="gotIt"></span></button>
</div></div>
